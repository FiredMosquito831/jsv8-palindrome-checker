<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="main">
      <h1>Is it a palindrome?</h1>
      <div id="input-wrap">
        <label for="text-input">Enter in text to check for a palindrome:</label>
        <input id="text-input" class="user-input" type="text" value="" />
        <button id="check-btn" class="user-input" type="button">Check</button>
      </div>
      <div id="result"></div>
      <div id="hint">
        A <dfn>palindrome</dfn> is a word or sentence that's spelled the same way both
        forward and backward, ignoring punctuation, case, and spacing.
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
